    <path d="m125 140 66-105M123 149h70" stroke="#d1d8ff" stroke-width="2"/>
    <rect x="224" y="32" width="92" height="178" rx="9" fill="#756284"/>
    <path d="m270 66 30 51-30 51-30-51Z" fill="#c4a6ba"/>
