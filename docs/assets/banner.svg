    <text x="64" y="175" fill="#f1f3ff" font-size="76" font-weight="700">GameShelf</text>
    <text x="68" y="228" fill="#c2c9de" font-size="27">Your collection, on display.</text>
    <text x="68" y="296" fill="#a3afcc" font-size="16" letter-spacing="2">WINDOWS / LOCAL CATALOG / VIBE CODED</text>
  </g>
