<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">GameShelf — Your collection, on display</title>
  <desc id="desc">A dark navy banner with lavender lettering and three abstract game cases resting on a shelf. Decorative artwork, not an app screenshot.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#141824"/><stop offset="1" stop-color="#252d48"/></linearGradient>
    <linearGradient id="case" x2="0" y2="1"><stop stop-color="#a9b6ff"/><stop offset="1" stop-color="#505f9c"/></linearGradient>
  </defs>
  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <circle cx="1110" cy="55" r="220" fill="#889bff" opacity=".04"/>
  <g font-family="Segoe UI, Arial, sans-serif">
