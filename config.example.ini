; Sanitized reference only. The app creates config.ini after a valid folder selection.
; Relative root is empty until selected. Quotes use JSON string escaping.
[app]
version="1"

[library]
root=""
collectionPrefix="[C]"
showCollectionGames="true"

[metadata]
; IGDB remains disabled until explicitly enabled with credentials below.
matchingThreshold="0.75"
greedyMatch="false"
providerOrder="igdb,thegamesdb,steamgriddb"

[provider.igdb]
enabled="false"
clientId=""
clientSecret=""

[provider.thegamesdb]
enabled="false"
apiKey=""

[provider.steamgriddb]
enabled="false"
apiKey=""

[view]
defaultSort="title"
